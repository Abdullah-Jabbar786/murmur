name: ci
on: [push, pull_request]
jobs:
  test:
    # Keep the OS/TShark packaging reproducible; latest denied repository Lua reads.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Install TShark for Lua dissector acceptance
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version
      - run: python -m pytest -q
        env:
          MURMUR_REQUIRE_TSHARK: "1"
